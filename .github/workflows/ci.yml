name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax verification
        run: |
          python -m py_compile main.py sudoku.py gui/app.py logic/*.py camera_solver/*.py
      - name: Run unit test suite
        run: python -m unittest discover tests
